# Builds the Android debug APK (unsigned for distribution; debug-signed by Gradle) for every code change.
# Uses no repository secrets, so pull requests from forks cannot reach any credential. Never publishes a release.
name: android
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Project checks (config, permissions, bundle contents, no secrets)
        run: node --test tests/android-project.test.cjs tests/pwa.test.cjs
      # The runner image ships the Android SDK (ANDROID_HOME); scripts/gradle.mjs prints size and SHA-256.
      - run: npm run build:android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
